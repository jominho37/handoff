server:
  port: ${PORT:8080}

spring:
  application:
    name: handoff
  ai:
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY}
        project-id: handoff-project
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.7
        embedding:
          api-key: ${GOOGLE_AI_API_KEY}
          project-id: handoff-project
          options:
            model: gemini-embedding-2
