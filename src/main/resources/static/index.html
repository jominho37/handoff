<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>카페 핸드오프 매니저</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        *, *::before, *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          -webkit-tap-highlight-color: transparent;
        }

        :root {
          --primary: #FF6B1A;
          --primary-hover: #F25A0A;
          --primary-soft: #FFF2E8;
          --bg: #FFFFFF;
          --bubble-bot: #F2F3F5;
          --text-primary: #1A1A1A;
          --text-secondary: #8A8A8A;
          --text-muted: #B8B8B8;
          --border: #EFEFEF;
          --input-bg: #F5F6F8;
        }

        html, body {
          height: 100%;
          overflow: hidden;
        }

        body {
          font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
                       'Malgun Gothic', sans-serif;
          background: #ECECEC;
          color: var(--text-primary);
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          letter-spacing: -0.01em;
        }

        .app {
          max-width: 480px;
          margin: 0 auto;
          height: 100vh;
          height: 100dvh;
          display: flex;
          flex-direction: column;
          background: var(--bg);
          position: relative;
          box-shadow: 0 0 24px rgba(0, 0, 0, 0.04);
        }

        /* ---------- Header ---------- */
        .header {
          height: 52px;
          display: flex;
          align-items: center;
          padding: 0 8px;
          flex-shrink: 0;
          background: var(--bg);
          position: relative;
          z-index: 2;
        }

        .back-btn {
          width: 40px;
          height: 40px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: none;
          border: none;
          cursor: pointer;
          color: var(--primary);
          border-radius: 10px;
          transition: background 0.15s ease;
        }
        .back-btn:active { background: var(--primary-soft); }

        /* ---------- Chat area ---------- */
        .chat {
          flex: 1;
          overflow-y: auto;
          overflow-x: hidden;
          padding: 8px 16px 20px;
          display: flex;
          flex-direction: column;
          gap: 14px;
          scroll-behavior: smooth;
          overscroll-behavior: contain;
        }
        .chat::-webkit-scrollbar { width: 0; height: 0; }

        .message {
          display: flex;
          flex-direction: column;
          max-width: 80%;
          animation: slideIn 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideIn {
          from { opacity: 0; transform: translateY(10px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .message.bot { align-self: flex-start; align-items: flex-start; }
        .message.user { align-self: flex-end; align-items: flex-end; }

        .bubble {
          padding: 12px 14px;
          border-radius: 16px;
          font-size: 14.5px;
          line-height: 1.55;
          word-break: break-word;
          white-space: pre-wrap;
          font-weight: 400;
        }

        .message.bot .bubble {
          background: var(--bubble-bot);
          color: var(--text-primary);
          border-top-left-radius: 4px;
        }

        .message.user .bubble {
          background: var(--primary);
          color: #fff;
          border-top-right-radius: 4px;
          box-shadow: 0 2px 8px rgba(255, 107, 26, 0.18);
        }

        .timestamp {
          font-size: 11px;
          color: var(--text-muted);
          margin-top: 4px;
          padding: 0 4px;
          font-weight: 400;
        }

        /* Typing indicator */
        .typing {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          padding: 3px 2px;
        }
        .typing span {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #B0B4BA;
          display: inline-block;
          animation: blink 1.3s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.18s; }
        .typing span:nth-child(3) { animation-delay: 0.36s; }

        @keyframes blink {
          0%, 80%, 100% { transform: translateY(0) scale(0.85); opacity: 0.45; }
          40%           { transform: translateY(-3px) scale(1);  opacity: 1; }
        }

        /* ---------- Input area ---------- */
        .input-area {
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 10px 12px 12px;
          background: var(--bg);
          border-top: 1px solid var(--border);
          flex-shrink: 0;
        }

        .attach-btn {
          width: 38px;
          height: 38px;
          background: none;
          border: none;
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--primary);
          cursor: pointer;
          flex-shrink: 0;
          border-radius: 10px;
          transition: background 0.15s ease;
        }
        .attach-btn:active { background: var(--primary-soft); }

        .input-wrap {
          flex: 1;
          display: flex;
          align-items: center;
          background: var(--input-bg);
          border-radius: 22px;
          padding: 0 5px 0 16px;
          min-height: 42px;
          transition: background 0.15s ease;
        }
        .input-wrap:focus-within { background: #ECEEF1; }

        #message-input {
          flex: 1;
          border: none;
          background: transparent;
          padding: 10px 8px 10px 0;
          font-size: 14.5px;
          outline: none;
          font-family: inherit;
          color: var(--text-primary);
          min-width: 0;
        }
        #message-input::placeholder { color: #B8B8B8; }

        .send-btn {
          width: 32px;
          height: 32px;
          border-radius: 50%;
          border: none;
          background: var(--primary);
          color: white;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          flex-shrink: 0;
          transition: transform 0.12s ease, background 0.15s ease, opacity 0.15s ease;
        }
        .send-btn:active:not(:disabled) { transform: scale(0.92); background: var(--primary-hover); }
        .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* ---------- Tab bar ---------- */
        .tab-bar {
          display: flex;
          border-top: 1px solid var(--border);
          background: white;
          flex-shrink: 0;
          padding-bottom: env(safe-area-inset-bottom);
        }

        .tab {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 4px;
          padding: 9px 0 10px;
          border: none;
          background: none;
          cursor: pointer;
          color: #9A9A9A;
          font-size: 11px;
          font-weight: 500;
          font-family: inherit;
          transition: color 0.15s ease;
        }
        .tab .icon { width: 24px; height: 24px; display: block; }
        .tab.active { color: var(--primary); }
        .tab.active .icon-bg {
          background: var(--primary);
          color: #fff;
          width: 28px;
          height: 28px;
          border-radius: 9px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 4px 10px rgba(255, 107, 26, 0.28);
        }
        .tab.active .icon-bg .icon { width: 18px; height: 18px; }
    </style>
</head>
<body>
<div class="app">
    <!-- Header -->
    <header class="header">
        <button class="back-btn" aria-label="뒤로가기">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </header>

    <!-- Chat -->
    <main class="chat" id="chat" role="log" aria-live="polite"></main>

    <!-- Input -->
    <div class="input-area">
        <button class="attach-btn" aria-label="이미지 첨부">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="18" height="15" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="8.5" cy="10.5" r="1.5" fill="currentColor"/>
                <path d="M21 17l-5.5-5.5L7 20" stroke="currentColor" stroke-width="1.8"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="input-wrap">
            <input id="message-input" type="text" placeholder="질문을 입력하세요"
                   autocomplete="off" enterkeyhint="send" maxlength="500">
            <button class="send-btn" id="send-btn" aria-label="전송" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                    <path d="M3.4 11.3l16.5-7.1c1.1-.5 2.2.6 1.7 1.7l-7.1 16.5c-.5 1.1-2 1-2.4-.1l-2.4-6.6-6.6-2.4c-1.1-.4-1.2-1.9-.1-2.4z"
                          fill="currentColor"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Bottom tabs -->
    <nav class="tab-bar" aria-label="주요 메뉴">
        <button class="tab">
            <svg class="icon" viewBox="0 0 24 24" fill="none">
                <path d="M5 5h11l3 3v11H5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <path d="M8 11h8M8 15h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            공지
        </button>
        <button class="tab">
            <svg class="icon" viewBox="0 0 24 24" fill="none">
                <path d="M5 4h9a4 4 0 014 4v12H9a4 4 0 01-4-4V4z" stroke="currentColor"
                      stroke-width="1.7" stroke-linejoin="round"/>
                <path d="M9 9h6M9 13h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            메뉴얼
        </button>
        <button class="tab active">
      <span class="icon-bg">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <path d="M21 11.5c0 4.1-4 7.5-9 7.5-1.2 0-2.4-.2-3.5-.6L4 20l1.4-3.7C4.5 15 4 13.3 4 11.5 4 7.4 8 4 13 4s8 3.4 8 7.5z"
                fill="currentColor"/>
        </svg>
      </span>
            챗봇
        </button>
        <button class="tab">
            <svg class="icon" viewBox="0 0 24 24" fill="none">
                <circle cx="6" cy="12" r="1.7" fill="currentColor"/>
                <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
                <circle cx="18" cy="12" r="1.7" fill="currentColor"/>
            </svg>
            더보기
        </button>
    </nav>
</div>

<script>
    const chatEl  = document.getElementById('chat');
    const inputEl = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    /* ---------- helpers ---------- */
    function formatTime(date = new Date()) {
      const h = date.getHours();
      const m = date.getMinutes().toString().padStart(2, '0');
      const ampm = h < 12 ? '오전' : '오후';
      const h12  = h === 0 ? 12 : (h > 12 ? h - 12 : h);
      return `${ampm} ${h12}:${m}`;
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatEl.scrollTop = chatEl.scrollHeight;
      });
    }

    function addMessage(role, text) {
      const wrap = document.createElement('div');
      wrap.className = `message ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      const ts = document.createElement('div');
      ts.className = 'timestamp';
      ts.textContent = formatTime();

      wrap.append(bubble, ts);
      chatEl.appendChild(wrap);
      scrollToBottom();
      return wrap;
    }

    function showTyping() {
      const wrap = document.createElement('div');
      wrap.className = 'message bot';
      wrap.id = 'typing-indicator';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';

      wrap.appendChild(bubble);
      chatEl.appendChild(wrap);
      scrollToBottom();
    }

    function hideTyping() {
      document.getElementById('typing-indicator')?.remove();
    }

    /* ---------- send ---------- */
    let pending = false;

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || pending) return;

      pending = true;
      inputEl.value = '';
      updateSendState();

      addMessage('user', text);
      showTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        hideTyping();

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const answer = (data && typeof data.answer === 'string' && data.answer.trim())
          ? data.answer
          : '죄송해요, 답변을 가져오지 못했어요. 다시 시도해 주세요.';
        addMessage('bot', answer);
      } catch (err) {
        console.error('chat error:', err);
        hideTyping();
        addMessage('bot', '⚠️ 서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');
      } finally {
        pending = false;
        updateSendState();
        inputEl.focus();
      }
    }

    function updateSendState() {
      sendBtn.disabled = pending || inputEl.value.trim().length === 0;
    }

    /* ---------- events ---------- */
    inputEl.addEventListener('input', updateSendState);

    inputEl.addEventListener('keydown', (e) => {
      // 한글 입력 조합 중에는 Enter를 무시
      if (e.key === 'Enter' && !e.isComposing && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    /* ---------- initial bot message ---------- */
    addMessage('bot', '안녕하세요! 카페 핸드오프 매니저입니다. 레시피나 매장 정보에 대해 무엇이든 물어보세요.');
</script>
</body>
</html>
